<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src ws://127.0.0.1:*"
		/>
		<title>View</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #111;
				overflow: hidden;
			}

				width: 100%;
				height: 100%;
			}
			#status {
				position: fixed;
				top: 45%;
				width: 100%;
				text-align: center;
				color: #aaa;
				font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
			}
		</style>
	</head>
	<body>
		<div id="status">Connecting to the host…</div>
		<div id="screen"></div>
		<script type="module" src="./vnc-viewer/main.ts"></script>

</html>
