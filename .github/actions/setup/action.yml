# Shared by every CI job: Bun, a cached package store, and the workspace install.
name: Setup
description: Install Bun and the workspace dependencies
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # Tests make throwaway repos and commit into them.
    - shell: bash
      run: |
        git config --global user.name "Odin CI"
        git config --global user.email "ci@odin.local"

    - shell: bash
      run: bun install --frozen-lockfile
