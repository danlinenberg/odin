# Every PR and every push to main: lint, typecheck, the unit and integration
# suites, the app build, then a smoke test that boots the built app in a
# throwaway home and clicks through its main flows (apps/desktop/scripts/smoke.ts).
# Five jobs run side by side, so a run takes as long as the app build and
# smoke, not the sum of every step.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR supersedes the run in flight. On main a started
# run always finishes - PRs merge faster than a run takes, so cancelling there
# left main with no result at all; only the newest waiting run is kept.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing here touches the OS, so it runs on Linux and keeps the scarce
  # macOS runners for the jobs that need one.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The lint guards in scripts/ scan with ripgrep.
      - run: command -v rg || sudo apt-get install -y ripgrep

      - run: bun run lint

      - run: bun run typecheck

  # macOS, like Release: much of the suite drives real PTYs, ps and codesign.
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: bun run test

  # The smoke test needs a window server to boot Electron.
  app:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SKIP_ENV_VALIDATION: "true"
      # Nothing reads them here, and they cost a third of the renderer build.
      ODIN_SKIP_SOURCEMAPS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # postinstall skips this when CI is set, so rebuild the native modules
      # for Electron before booting the app.
      - run: bun run --filter=@odin/desktop install:deps

      - run: bun run compile:app
        working-directory: apps/desktop

      - run: bun run smoke
        working-directory: apps/desktop
        env:
          SMOKE_SHOTS_DIR: ${{ runner.temp }}/smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  # The same smoke on Windows, where Odin also ships. Sessions there run in
  # Git Bash, so the sh fake claude works; only the macOS-only flow is skipped.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SKIP_ENV_VALIDATION: "true"
      ODIN_SKIP_SOURCEMAPS: "1"
      # native-keymap builds with warnings-as-errors; see release.yml.
      _CL_: -wd4996
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: bun run --filter=@odin/desktop install:deps

      - run: bun run compile:app
        working-directory: apps/desktop

      - run: bun run smoke
        working-directory: apps/desktop
        env:
          SMOKE_SHOTS_DIR: ${{ runner.temp }}/smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-windows
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  # The Android app (apps/mobile/android): builds the debug APK, then pairs it
  # in an emulator with fake-odin through the odin://pair link and waits for
  # the board (apps/mobile/scripts/android-test.sh). Linux runners have KVM.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - working-directory: apps/mobile
        run: bun run android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd apps/mobile && bun run android:test

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/android
          if-no-files-found: ignore

  # Branch protection requires one check named `check`. It passes only when all
  # five jobs passed: a skipped required check would count as green.
  check:
    if: always()
    needs: [static, test, app, windows, android]
    runs-on: ubuntu-latest
    steps:
      - run: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
